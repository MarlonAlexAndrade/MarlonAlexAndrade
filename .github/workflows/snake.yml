name: Gerar Cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"   # roda automaticamente 2x por dia
  workflow_dispatch:           # permite rodar manualmente também

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=40E0D0&color_dots=#1a1b27,#1a1b27,#164e4e,#0d9488,#40E0D0
            dist/github-contribution-grid-snake-dark.svg?color_snake=40E0D0&color_dots=#1a1b27,#1a1b27,#164e4e,#0d9488,#40E0D0

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
